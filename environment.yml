name: butterfly_phylogeny
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  # Bioinformatics
  - bioconda::mafft
  - bioconda::iqtree
  - bioconda::biopython=1.83
  # Data science
  - numpy>=1.26
  - pandas>=2.2
  - matplotlib>=3.8
  - seaborn>=0.13
  - scipy>=1.12
  # Tree visualization
  - pip:
    - ete3>=3.1.3
    - reportlab>=4.1
    - lxml>=5.1
